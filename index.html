<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Puente</title>
    <meta name="description" content="La app del grupo de The Bridge 2027." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/iconos/apple-touch-icon.png" />
    <meta name="theme-color" content="#1E242C" />
    <meta name="apple-mobile-web-app-title" content="Puente" />
    <script>
      // El modo elegido en Tu perfil (oscuro por defecto), antes de dibujar: igual que src/datos/tema.ts
      try {
        if (localStorage.getItem('puente.tema') === 'claro') {
          document.documentElement.dataset.tema = 'claro'
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#EEF1F4')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="raiz"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
